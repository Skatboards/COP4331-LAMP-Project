<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Desk | Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="app-page">
    <div class="background-glow"></div>
    <main class="container app-container">
        <header class="app-header">
            <div class="brand-lockup">
                <div class="app-mark app-mark-small" aria-hidden="true"><i class="bi bi-shield-lock-fill"></i></div>
                <div><p class="eyebrow mb-1">Administration</p><h1 class="brand-title">Contact Desk</h1></div>
            </div>
            <div class="user-bar">
                <a class="btn btn-outline-light btn-sm" href="color.html"><i class="bi bi-arrow-left me-1"></i>Contacts</a>
                <button type="button" class="btn btn-outline-danger btn-sm" onclick="doLogout();"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
            </div>
        </header>

        <section class="dashboard-heading">
            <div><p class="eyebrow">Admin workspace</p><h2>Manage access</h2><p class="page-subtitle">Review accounts and keep an eye on every contact record.</p></div>
        </section>
        <p id="adminStatus" class="status-message" role="status" aria-live="polite"></p>

        <section class="admin-grid">
            <section class="card glass-card dashboard-card" aria-labelledby="usersTitle">
                <div class="card-body">
                    <div class="toolbar">
                        <div><h2 id="usersTitle" class="section-title">Users</h2><p class="section-note">Disable access without deleting an account.</p></div>
                        <form class="search-form" onsubmit="event.preventDefault(); loadAdminUsers(document.getElementById('userSearch').value.trim());">
                            <label for="userSearch" class="visually-hidden">Search users</label>
                            <input type="search" id="userSearch" class="form-control" placeholder="Search users" autocomplete="off">
                            <button type="submit" class="btn btn-outline-light">Search</button>
                        </form>
                    </div>
                    <div id="userList" class="contact-list"></div>
                </div>
            </section>

            <section class="card glass-card form-card" aria-labelledby="adminCreateTitle">
                <div class="card-body">
                    <div class="form-card-heading"><div><p class="eyebrow">Access control</p><h2 id="adminCreateTitle">Create Admin</h2></div></div>
                    <form id="adminForm" onsubmit="event.preventDefault(); createAdmin();" novalidate>
                        <div class="row g-3">
                            <div class="col-sm-6"><label for="adminFirstName" class="form-label form-label-contrast">First name</label><input id="adminFirstName" class="form-control" maxlength="50" required></div>
                            <div class="col-sm-6"><label for="adminLastName" class="form-label form-label-contrast">Last name</label><input id="adminLastName" class="form-control" maxlength="50" required></div>
                            <div class="col-12"><label for="adminUsername" class="form-label form-label-contrast">Username</label><input id="adminUsername" class="form-control" maxlength="50" required></div>
                            <div class="col-12"><label for="adminPassword" class="form-label form-label-contrast">Temporary password</label><input type="password" id="adminPassword" class="form-control" maxlength="200" required></div>
                        </div>
                        <p id="adminFormStatus" class="status-message" role="status" aria-live="polite"></p>
                        <button type="submit" class="btn btn-primary w-100">Create Admin</button>
                    </form>
                </div>
            </section>
        </section>

        <section class="card glass-card dashboard-card admin-contacts-card" aria-labelledby="allContactsTitle">
            <div class="card-body">
                <div class="toolbar"><div><h2 id="allContactsTitle" class="section-title">All contacts</h2><p class="section-note">Read-only administrative view with account ownership.</p></div><form class="search-form" onsubmit="event.preventDefault(); loadAllContacts(document.getElementById('allContactSearch').value.trim());"><label for="allContactSearch" class="visually-hidden">Search all contacts</label><input type="search" id="allContactSearch" class="form-control" placeholder="Search all contacts" autocomplete="off"><button type="submit" class="btn btn-outline-light">Search</button></form></div>
                <div id="adminContactList" class="contact-list"></div>
            </div>
        </section>
    </main>
    <script>document.addEventListener('DOMContentLoaded', initAdminPage);</script>
</body>
</html>
