<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Contact Desk | Verify email</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script src="js/verify.js" defer></script>
</head>
<body class="auth-page">
    <div class="background-glow"></div>
    <main class="container auth-container">
        <div class="auth-intro">
            <div class="app-mark" aria-hidden="true"><i class="bi bi-person-check-fill"></i></div>
            <p class="eyebrow">Contact Desk</p>
            <h1>Verify your email</h1>
            <p class="intro-copy">Confirm your email address to finish setting up your account.</p>
        </div>

        <section class="card glass-card auth-card" aria-labelledby="verifyTitle">
            <div class="card-body">
                <div class="auth-heading">
                    <p class="eyebrow">Account verification</p>
                    <h2 id="verifyTitle">Ready to verify?</h2>
                </div>
                <form id="verificationForm">
                    <button type="submit" id="verifyButton" class="btn btn-primary w-100 py-3 fw-semibold">
                        Verify email <i class="bi bi-check2 ms-1"></i>
                    </button>
                </form>
                <p id="verificationStatus" class="status-message" role="status" aria-live="polite"></p>
                <p class="switch-prompt"><a class="link-button" href="index.html">Return to sign in</a></p>
            </div>
        </section>
    </main>
</body>
</html>
