<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Desk | Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="auth-page">
    <div class="background-glow"></div>
    <main class="container auth-container">
        <div class="auth-intro">
            <div class="app-mark" aria-hidden="true"><i class="bi bi-person-lines-fill"></i></div>
            <p class="eyebrow">Personal contacts</p>
            <h1 id="title">Contact Desk</h1>
            <p class="intro-copy">Keep the people who matter close, organized, and easy to reach.</p>
        </div>

        <section class="card glass-card auth-card" aria-labelledby="authTitle">
            <div class="card-body">
                <div class="auth-heading">
                    <p class="eyebrow">Welcome back</p>
                    <h2 id="authTitle">Sign in to your desk</h2>
                </div>

                <div id="loginPanel">
                    <form id="loginForm" onsubmit="event.preventDefault(); doLogin();" novalidate>
                        <div class="mb-3">
                            <label for="loginName" class="form-label form-label-contrast">Username</label>
                            <input type="text" id="loginName" class="form-control" autocomplete="username" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label form-label-contrast">Password</label>
                            <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" id="loginButton" class="btn btn-primary w-100 py-3 fw-semibold">Sign in <i class="bi bi-arrow-up-right ms-1"></i></button>
                    </form>
                    <p class="switch-prompt">New here? <button type="button" class="link-button" onclick="showRegister();">Create an account</button></p>
                </div>

                <div id="registerPanel" class="d-none">
                    <form id="registerForm" onsubmit="event.preventDefault(); doRegister();" novalidate>
                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="registerFirstName" class="form-label form-label-contrast">First name</label>
                                <input type="text" id="registerFirstName" class="form-control" autocomplete="given-name" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="registerLastName" class="form-label form-label-contrast">Last name</label>
                                <input type="text" id="registerLastName" class="form-control" autocomplete="family-name" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="registerUsername" class="form-label form-label-contrast">Username</label>
                            <input type="text" id="registerUsername" class="form-control" autocomplete="username" required>
                        </div>
                        <div class="mb-4">
                            <label for="registerPassword" class="form-label form-label-contrast">Password</label>
                            <input type="password" id="registerPassword" class="form-control" autocomplete="new-password" required>
                        </div>
                        <button type="submit" id="registerButton" class="btn btn-primary w-100 py-3 fw-semibold">Create account <i class="bi bi-arrow-up-right ms-1"></i></button>
                    </form>
                    <p class="switch-prompt">Already have an account? <button type="button" class="link-button" onclick="showLogin();">Sign in</button></p>
                </div>

                <p id="authResult" class="status-message" role="status" aria-live="polite"></p>
            </div>
        </section>
    </main>
</body>
</html>
