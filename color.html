<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="app-page">
    <div class="background-glow"></div>
    <main class="container app-container">
        <header class="app-header">
            <div class="brand-lockup">
                <div class="app-mark app-mark-small" aria-hidden="true"><i class="bi bi-person-lines-fill"></i></div>
                <div>
                    <p class="eyebrow mb-1">Personal contacts</p>
                    <h1 id="title" class="brand-title">Contact Desk</h1>
                </div>
            </div>
            <div class="user-bar">
                <span id="userName" class="user-name"></span>
                <a id="adminLink" class="btn btn-outline-light btn-sm d-none" href="admin.html"><i class="bi bi-shield-lock me-1"></i>Admin</a>
                <button type="button" id="logoutButton" class="btn btn-outline-light btn-sm" onclick="doLogout();"><i class="bi bi-box-arrow-right me-1"></i>Log out</button>
            </div>
        </header>

        <section class="dashboard-heading">
            <div>
                <p class="eyebrow">Your address book</p>
                <h2>Contacts</h2>
                <p class="page-subtitle">A simple place for the people you want within reach.</p>
            </div>
            <button type="button" class="btn btn-primary" onclick="openCreateContact();"><i class="bi bi-plus-lg me-2"></i>Add contact</button>
        </section>

        <section class="card glass-card dashboard-card" aria-labelledby="contactsTitle">
            <div class="card-body">
                <div class="toolbar">
                    <div>
                        <h2 id="contactsTitle" class="section-title">All contacts</h2>
                        <p id="contactStatus" class="status-message" role="status" aria-live="polite"></p>
                    </div>
                    <form class="search-form" onsubmit="event.preventDefault(); searchContacts(document.getElementById('searchText').value.trim());">
                        <label for="searchText" class="visually-hidden">Search contacts</label>
                        <div class="search-input-wrap">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="searchText" class="form-control" placeholder="Search name, email, or phone" autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-outline-light">Search</button>
                    </form>
                </div>
                <div id="contactList" class="contact-list" aria-live="polite" aria-busy="false"></div>
            </div>
        </section>

        <section class="card glass-card dashboard-card directory-card" aria-labelledby="directoryTitle">
            <div class="card-body">
                <div class="toolbar">
                    <div>
                        <h2 id="directoryTitle" class="section-title">Contact directory</h2>
                        <p id="directoryStatus" class="status-message" role="status" aria-live="polite"></p>
                    </div>
                    <form class="search-form" onsubmit="event.preventDefault(); loadDirectory(document.getElementById('directorySearch').value.trim());">
                        <label for="directorySearch" class="visually-hidden">Search contact directory</label>
                        <div class="search-input-wrap">
                            <i class="bi bi-search" aria-hidden="true"></i>
                            <input type="search" id="directorySearch" class="form-control" placeholder="Search the full directory" autocomplete="off">
                        </div>
                        <button type="submit" class="btn btn-outline-light">Search</button>
                    </form>
                </div>
                <div id="directoryList" class="contact-list" aria-live="polite" aria-busy="false"></div>
            </div>
        </section>

        <section id="contactFormPanel" class="card glass-card form-card d-none" aria-labelledby="contactFormTitle">
            <div class="card-body">
                <div class="form-card-heading">
                    <div>
                        <p class="eyebrow">Contact details</p>
                        <h2 id="contactFormTitle">Add contact</h2>
                    </div>
                    <button type="button" class="icon-button" aria-label="Close contact form" onclick="closeContactForm();"><i class="bi bi-x-lg"></i></button>
                </div>
                <form id="contactForm" onsubmit="event.preventDefault(); editingContactId ? updateContact() : createContact();" novalidate>
                    <div class="row g-3">
                        <div class="col-sm-6">
                            <label for="contactFirstName" class="form-label form-label-contrast">First name</label>
                            <input type="text" id="contactFirstName" class="form-control" maxlength="50" autocomplete="given-name">
                        </div>
                        <div class="col-sm-6">
                            <label for="contactLastName" class="form-label form-label-contrast">Last name</label>
                            <input type="text" id="contactLastName" class="form-control" maxlength="50" autocomplete="family-name">
                        </div>
                        <div class="col-sm-6">
                            <label for="contactEmail" class="form-label form-label-contrast">Email</label>
                            <input type="email" id="contactEmail" class="form-control" maxlength="50" autocomplete="email">
                        </div>
                        <div class="col-sm-6">
                            <label for="contactPhone" class="form-label form-label-contrast">Phone</label>
                            <input type="tel" id="contactPhone" class="form-control" maxlength="20" autocomplete="tel">
                        </div>
                    </div>
                    <p id="contactFormStatus" class="status-message" role="status" aria-live="polite"></p>
                    <div class="form-actions">
                        <button type="button" class="btn btn-outline-light" onclick="closeContactForm();">Cancel</button>
                        <button type="submit" id="saveContactButton" class="btn btn-primary">Add contact</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
    <script>document.addEventListener('DOMContentLoaded', readCookie);</script>
</body>
</html>
